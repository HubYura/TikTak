name: Render videos

# Озвучує (ukrainian-tts, голос Лада) і рендерить (Blender) усі відеопояснення,
# а потім комітить готові кліпи в public/videos тієї ж гілки.
# Запуск: вручну (Actions → Render videos → Run workflow) або пушем зміни
# сценаріїв/партитури в гілку claude/**.

on:
  workflow_dispatch:
    inputs:
      speaker:
        description: 'Голос ukrainian-tts: Lada, Tetiana, Mykyta, Oleksa, Dmytro (порожньо — Lada)'
        required: false
        default: ''
      res:
        description: 'Роздільність'
        required: false
        default: '960x540'
  push:
    branches: ['claude/**']
    paths:
      - 'video/clips.json'
      - 'video/voice.py'
      - 'video/blender/render.py'
      - '.github/workflows/videos.yml'

permissions:
  contents: write

concurrency:
  group: videos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ukrainian-tts працює на Python 3.10, а bpy — лише на 3.11, тож озвучка — окремою задачею
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Встановити ukrainian-tts і ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q git+https://github.com/robinhad/ukrainian-tts.git
      - name: Озвучити всі кліпи
        run: |
          SPK="${{ github.event.inputs.speaker }}"
          python video/voice.py ${SPK:+--speaker "$SPK"}
      - uses: actions/upload-artifact@v4
        with:
          name: voice
          path: |
            video/out/*/voice.wav
            video/out/*/spans.json
          retention-days: 7

  render:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Встановити Blender (bpy), ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
          pip install -q bpy==5.0.1

      - uses: actions/download-artifact@v4
        with:
          name: voice
          path: video/out

      - name: Вибрати свою частину кліпів
        id: part
        run: |
          ids=$(python -c "import json;c=json.load(open('video/clips.json'));print(' '.join(x['id'] for i,x in enumerate(c) if i%4==${{ matrix.part }}))")
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "Кліпи: $ids"

      - name: Зрендерити
        run: |
          RES="${{ github.event.inputs.res }}"
          python video/blender/render.py -- --engine CYCLES --samples 5 --res "${RES:-960x540}" --only ${{ steps.part.outputs.ids }}

      - uses: actions/upload-artifact@v4
        with:
          name: clips-${{ matrix.part }}
          path: |
            video/out/*/*.mp4
            video/out/*/*.jpg
            video/out/*/*.vtt
            video/out/*/spans.json
          retention-days: 7

  publish:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          pattern: clips-*
          path: video/out
          merge-multiple: true

      - name: Підготувати для сайту
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python video/publish.py

      - name: Закомітити кліпи
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos
          if git diff --cached --quiet; then echo "Без змін"; exit 0; fi
          git commit -m "Re-render explainer videos with the Lada voice (ukrainian-tts)"
          # Поки йшов рендер, у гілку могли запушити інші коміти — стаємо поверх них
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
